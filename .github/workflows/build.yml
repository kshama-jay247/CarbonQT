name: Build CarbonQT Binaries

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build

      - name: Rename binary
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            mv build/carbonqt build/carbonqt-linux
          elif [ "${{ runner.os }}" == "macOS" ]; then
            mv build/carbonqt build/carbonqt-macos
          else
            mv build/Release/carbonqt.exe build/carbonqt-windows.exe
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: carbonqt-${{ runner.os }}
          path: build/*
